name: Compilar app Android
on:
  push:
    branches: [app-android]
    paths-ignore: ['builds/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Compilar
        working-directory: android
        run: gradle --no-daemon assembleRelease bundleRelease assembleDebug 2>&1 | tee ../builds_log.txt
      - name: Guardar resultado en la rama
        if: always()
        run: |
          mkdir -p builds
          cp builds_log.txt builds/log.txt || true
          cp android/app/build/outputs/apk/release/*.apk builds/ 2>/dev/null || true
          cp android/app/build/outputs/bundle/release/*.aab builds/ 2>/dev/null || true
          cp android/app/build/outputs/apk/debug/*.apk builds/ 2>/dev/null || true
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -f builds
          git commit -m "builds [skip ci]" || true
          git push
